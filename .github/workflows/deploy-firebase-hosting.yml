name: DNS Partner Hub — Firebase Hosting
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: dns-partner-hub-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dns-partner-hub-production
    env:
      VITE_DNS_FIREBASE_PROJECT_ID: dns-core
      VITE_DNS_FIREBASE_API_KEY: ${{ vars.DNS_FIREBASE_WEB_API_KEY }}
      VITE_DNS_FIREBASE_AUTH_DOMAIN: ${{ vars.DNS_FIREBASE_AUTH_DOMAIN }}
      VITE_DNS_FIREBASE_APP_ID: ${{ vars.DNS_FIREBASE_WEB_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify DNS-only Firebase configuration
        run: node scripts/hosting-preflight.mjs
      - run: npm run check
      - name: Authenticate Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DNS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DNS_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm install --global firebase-tools
      - name: Deploy dedicated DNS site only
        run: firebase deploy --project dns-core --only hosting:partner-hub --non-interactive
