name: DNS Partner Hub — Pages Preview
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dns-partner-hub-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DNS_PAGES_PREVIEW: 'true'
      VITE_DNS_STATIC_PREVIEW: 'false'
      VITE_DNS_FIREBASE_API_KEY: ${{ secrets.DNS_FIREBASE_WEB_API_KEY }}
      VITE_DNS_FIREBASE_AUTH_DOMAIN: ${{ vars.DNS_FIREBASE_AUTH_DOMAIN }}
      VITE_DNS_FIREBASE_PROJECT_ID: dns-core
      VITE_DNS_FIREBASE_APP_ID: ${{ vars.DNS_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Require real DNS Core Firebase web configuration
        run: |
          test -n "$VITE_DNS_FIREBASE_API_KEY" || { echo 'Missing DNS_FIREBASE_WEB_API_KEY secret'; exit 1; }
          test -n "$VITE_DNS_FIREBASE_AUTH_DOMAIN" || { echo 'Missing DNS_FIREBASE_AUTH_DOMAIN variable'; exit 1; }
          test -n "$VITE_DNS_FIREBASE_APP_ID" || { echo 'Missing DNS_FIREBASE_APP_ID variable'; exit 1; }
      - name: Typecheck frontend
        run: npm run lint
      - name: Build static frontend only
        run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
